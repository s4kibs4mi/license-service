services:
  license-service:
    build:
      context: .
    volumes:
      - "./src/main/resources/application-containerized.yml:/opt/application.yml"
    command:
      - "--spring.config.location=file:/opt/application.yml"
    depends_on:
      - postgres
    restart: unless-stopped
    ports:
      - "8082:8082"

  postgres:
    image: "postgres:16-alpine"
    environment:
      - "POSTGRES_DB=license-service"
      - "POSTGRES_PASSWORD=password"
      - "POSTGRES_USER=root"
    ports:
      - '5432:5432'
